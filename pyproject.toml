[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "idss-toolkit"
version = "0.2.0"
description = "Validation-based deployment suitability scoring for intrusion detection models"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Mustafa Furkan Ceylan"}, {name = "Gökhan Dalkılıç"}]
dependencies = []

[project.scripts]
idss = "idss.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
